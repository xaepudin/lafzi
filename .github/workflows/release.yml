name: Release

# Tag a commit to build everything and attach it to a GitHub Release:
#   git tag v2.2.0 && git push origin v2.2.0
# The workflow can also be started manually from the Actions tab; in that case
# the artifacts are only uploaded to the run, no release is created.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Releases are debug-signed unless the upload key is configured, which
      # Play rejects. See the CI/CD section of the README for the secrets.
      - name: Configure upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; artifacts will be debug-signed and cannot be published to Play."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build app bundle
        run: flutter build appbundle --release

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -E "Signer #1 certificate DN|SHA-256"
          done

      - name: Name artifacts
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "lafzi-$VERSION-$abi.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "lafzi-$VERSION.aab"
          ls -l lafzi-*

      # One artifact per architecture, so a download is a single APK rather than
      # a bundle with every ABI. Release assets are direct files anyway.
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a
          path: lafzi-*-arm64-v8a.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-armeabi-v7a
          path: lafzi-*-armeabi-v7a.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-x86_64
          path: lafzi-*-x86_64.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: lafzi-*.aab
          if-no-files-found: error

  macos:
    name: macOS app and DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The project signs ad-hoc (CODE_SIGN_IDENTITY = "-"), so this builds
      # without an Apple team. The result is not notarized: users must clear the
      # quarantine bit or use System Settings > Privacy & Security to open it.
      - name: Build macOS app
        run: flutter build macos --release

      - name: Package DMG
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          echo "Packaging $APP ($VERSION)"
          hdiutil create -volname "Lafzi" -srcfolder "$APP" -ov -format UDZO "Lafzi-$VERSION.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Lafzi-*.dmg
          if-no-files-found: error

  ios:
    name: iOS app (unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Unsigned: installable through sideloading tools that re-sign, or by
      # adding distribution secrets later. App Store upload needs a certificate
      # and provisioning profile.
      - name: Build iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/Lafzi-$VERSION-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Lafzi-*-unsigned.ipa
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [android, macos, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lafzi $GITHUB_REF_NAME" \
            --generate-notes
